# TASK-007 §D (v2.2 §13): 늦어짐 감지와 대안 (T-04). S0 [여행 중 데모 바로 보기] -> 데모 13:10 -> [+10분 늦게] 한 번(낮음, 알약만)
#   -> 데모 [+10분]으로 13:20(높음, T-04) -> [이걸로] -> 바뀐 동선 -> 같은 장소에서 다시 [+10분 늦게] -> 알림이 다시 안 뜸.
# 늦은 분 = 지금 시각 - 예정 출발(시드 코스 2번 12:55). 13:10 [+10분 늦게] 전에는 사건 없음, 뒤에는 낮음 15분, 13:20 높음 25분.
# TASK-014 §15 Q2·§16 Q1: Maestro만 13:05 -> 13:10·13:15 -> 13:20 (10분 단추로 갈 수 있는 시각). TASK-007 단위 테스트의 13:05는 그대로.
# 전제와 우회는 trip-now.yaml과 같다 (개발 서버 주소는 -e METRO_URL, 흐름 안 env: 블록 없음, 첫 탭 우회, 탭 retry).
# 실행 (apps/mobile에서, 시뮬레이터 UDID와 Metro 주소는 자기 것으로. 로컬 Supabase + 점검 서버, supabase/README.md. clearState로 매번 새 익명 사용자, 데모 시드는 매번 그 사용자 것으로 새로 만든다):
#   JAVA_HOME="$(brew --prefix openjdk@17)" maestro --udid <UDID> test \
#     --test-output-dir=.maestro/screenshots/trip-delay -e METRO_URL=http://127.0.0.1:8083 .maestro/trip-delay.yaml
# 스크린샷은 --test-output-dir 아래 takeScreenshot/ 에 쌓이고 저장소에는 올리지 않는다.
# 시각 막대는 하루 시작~끝(데모 시드 둘째 날 10:00~20:00)을 0~100%로 보고 누른 위치를 5분 단위로 맞춘다.
# TASK-014 §14 ④: 비율로 시각을 고르지 않는다 (31%는 칸이 0.8%뿐이라 기기 폭에 따라 13:00·13:10으로 떨어진다).
#   막대는 맨 앞(0% = 10:00)만 누르고 [+10분] 19번 = 13:10. [재생]/[멈춤]은 쓰지 않는다 (멈추는 때가 흔들림, §16 Q1).
# 데모 시드 코스는 고정이라 아래 시각이 정해져 있다. 코스가 바뀌면 시각과 글자를 다시 확인한다.
# 알려진 문제(원인 미확인, F7): 앱에 탭이 닿지 않는 현상. 아래 retry는 결과를 확인하는 묶음이라 두 번 눌러도 부작용이 없다.
appId: com.csh0616.tripfriends
---
- launchApp:
    clearState: true
# TASK-014 §14 ①: 개발 메뉴의 떠 있는 버튼(톱니)이 화면을 덮지 않게 여는 주소에 __expo_disable_fab=1.
# (§13의 launchApp 실행 인자 EXDevMenuShowFloatingActionButton은 효과가 없어 뺐다, reviewer 재점검)
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}&disableOnboarding=1&__expo_disable_fab=1
- tapOn:
    text: "열기"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 중 데모 바로 보기"
    timeout: 60000
# 개발 메뉴가 떠 있으면 직접 닫는다 (TASK-010 §12). 전에는 "AI 여행친구"를 한 번 눌러 첫 탭을 버렸는데,
# 그 탭이 실제로는 앱 위에 떠 있던 개발 메뉴 시트를 닫고 있었다 (첫 탭이 앱에 닿지 않던 원인)
- runFlow: common/close-dev-menu.yaml

- tapOn:
    id: "s0-now-demo"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 30000
- assertVisible:
    id: "sos-button"
- assertVisible:
    id: "input-bar"

# 데모 시계 열기 (패널이 없을 때만 누른다)
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "demo-panel"
          commands:
            - tapOn:
                id: "demo-toggle"
      - extendedWaitUntil:
          visible:
            id: "demo-panel"
          timeout: 3000

# 데모 13:10: 10:00 + [+10분] 19번. [+10분 늦게] 전이라 위치가 예정대로 길 위에 있어 아직 사건이 없다
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: "demo-bar"
          point: "0%,50%"
      - extendedWaitUntil:
          visible: "10:00"
          timeout: 3000
      - repeat:
          times: 19
          commands:
            - tapOn:
                id: "demo-plus-10"
      - extendedWaitUntil:
          visible: "13:10"
          timeout: 5000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-1-1310

# [+10분 늦게] 한 번: 아직 앞 장소에 머문다 -> 13:10 - 12:55 = 15분: 낮음, 알약만 "15분 늦어지는 중", 카드는 그대로
# 지연 표시("지연 10분")가 보이는 것을 기다려, 눌림이 앱까지 닿았는지 확인한다
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "지연 10분"
          commands:
            - tapOn:
                id: "demo-delay-10"
      - extendedWaitUntil:
          visible: "지연 10분"
          timeout: 3000
- extendedWaitUntil:
    visible: ".*15분 늦어지는 중.*"
    timeout: 10000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-2-low

# 데모 [+10분]으로 13:20: 위치는 그대로 두고 시각만 10분 -> 늦은 분 25분: 높음, T-04 카드
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "13:20"
          commands:
            - tapOn:
                id: "demo-plus-10"
      - extendedWaitUntil:
          visible: "13:20"
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "card-T-04"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*25분 늦어지고 있어.*"
    timeout: 10000
- takeScreenshot: trip-delay-3-t04

# 칸 고르기 + [이걸로 할래] (TASK-009 A1·A2): 첫 제안 칸을 고르면 확정 버튼이 켜진다. 고르기 전에는 일정이 그대로
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "card-T-04"
          commands:
            - tapOn:
                id: "proposal-.*"
                index: 0
            - extendedWaitUntil:
                visible:
                  id: "select-confirm"
                  enabled: true
                timeout: 3000
            - takeScreenshot: trip-delay-3b-chosen
            - tapOn:
                id: "select-confirm"
      - extendedWaitUntil:
          visible: "바꾼 일정으로 안내할게"
          timeout: 5000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-4-accepted

# 같은 장소에서 다시 [+10분 늦게] (지연 표시 10 -> 20분): 사건은 이미 처리됐으니 알림이 다시 뜨지 않는다 (AC-10)
- tapOn:
    id: "demo-delay-10"
- extendedWaitUntil:
    visible: "지연 20분"
    timeout: 5000
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 2000
    optional: true
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-5-no-repeat
