# TASK-007 §D (v2.2 §13): 늦어짐 감지와 대안 (T-04). S0 [여행 중 데모 바로 보기] -> 데모 13:05 -> [+10분 늦게] 한 번(낮음, 알약만)
#   -> 데모 [+10분]으로 13:15(높음, T-04) -> [이걸로] -> 바뀐 동선 -> 같은 장소에서 다시 [+10분 늦게] -> 알림이 다시 안 뜸.
# 늦은 분 = 지금 시각 - 예정 출발(시드 코스 2번 12:55). 13:00 사건 없음, 13:05 낮음 10분, 13:15 높음 20분.
# 전제와 우회는 trip-now.yaml과 같다 (개발 서버 주소는 -e METRO_URL, 흐름 안 env: 블록 없음, 첫 탭 우회, 탭 retry).
# 실행 (apps/mobile에서, 시뮬레이터 UDID와 Metro 주소는 자기 것으로. 서버는 새로 띄운 상태, 데모 시드는 매번 새로 만든다):
#   JAVA_HOME="$(brew --prefix openjdk@17)" maestro --udid <UDID> test \
#     --test-output-dir=.maestro/screenshots/trip-delay -e METRO_URL=http://127.0.0.1:8083 .maestro/trip-delay.yaml
# 스크린샷은 --test-output-dir 아래 takeScreenshot/ 에 쌓이고 저장소에는 올리지 않는다.
# 시각 막대는 하루 시작~끝(데모 시드 둘째 날 10:00~20:00)을 0~100%로 보고 누른 위치를 5분 단위로 맞춘다 (30% = 13:00, 한 칸 5분. 13:05는 31%쯤).
# 데모 시드 코스는 고정이라 아래 시각이 정해져 있다. 코스가 바뀌면 시각과 글자를 다시 확인한다.
# 알려진 문제(원인 미확인, F7): 앱에 탭이 닿지 않는 현상. 아래 retry는 결과를 확인하는 묶음이라 두 번 눌러도 부작용이 없다.
appId: com.csh0616.tripfriends
---
- launchApp:
    clearState: true
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}&disableOnboarding=1
- tapOn:
    text: "열기"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 중 데모 바로 보기"
    timeout: 60000
# 원인 미확인 우회: 앱이 뜬 뒤 첫 탭이 앱까지 가지 않는다. 가만해진 뒤 아무 일 없는 글자를 한 번 눌러 첫 탭을 먼저 쓴다
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "AI 여행친구"

- tapOn:
    id: "s0-now-demo"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 30000
- assertVisible:
    id: "sos-button"
- assertVisible:
    id: "input-bar"

# 데모 시계 열기 (패널이 없을 때만 누른다)
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "demo-panel"
          commands:
            - tapOn:
                id: "demo-toggle"
      - extendedWaitUntil:
          visible:
            id: "demo-panel"
          timeout: 3000

# 데모 13:05: 막대 31% (186분 -> 5분 단위로 13:05). 이 시각에는 아직 사건이 없다
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "demo-bar"
          point: "31%,50%"
      - extendedWaitUntil:
          visible: "13:05"
          timeout: 3000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-1-1305

# [+10분 늦게] 한 번 = 10분: 낮음, 알약만 "10분 늦어지는 중", 카드는 그대로
# 지연 표시("지연 10분")가 보이는 것을 기다려, 눌림이 앱까지 닿았는지 확인한다
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "지연 10분"
          commands:
            - tapOn:
                id: "demo-delay-10"
      - extendedWaitUntil:
          visible: "지연 10분"
          timeout: 3000
- extendedWaitUntil:
    visible: ".*10분 늦어지는 중.*"
    timeout: 10000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-2-low

# 데모 [+10분]으로 13:15: 위치는 그대로 두고 시각만 10분 -> 늦은 분 20분: 높음, T-04 카드
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "13:15"
          commands:
            - tapOn:
                id: "demo-plus-10"
      - extendedWaitUntil:
          visible: "13:15"
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "card-T-04"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*분 늦어지고 있어.*"
    timeout: 10000
- takeScreenshot: trip-delay-3-t04

# [이걸로]: 첫 제안. 고르기 전에는 일정이 그대로였고, 고른 뒤 안내 문장과 바뀐 동선
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "card-T-04"
          commands:
            - tapOn:
                text: "이걸로"
                index: 0
      - extendedWaitUntil:
          visible: "바꾼 일정으로 안내할게"
          timeout: 5000
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-4-accepted

# 같은 장소에서 다시 [+10분 늦게] (지연 표시 10 -> 20분): 사건은 이미 처리됐으니 알림이 다시 뜨지 않는다 (AC-10)
- tapOn:
    id: "demo-delay-10"
- extendedWaitUntil:
    visible: "지연 20분"
    timeout: 5000
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 2000
    optional: true
- assertNotVisible:
    id: "card-T-04"
- takeScreenshot: trip-delay-5-no-repeat
