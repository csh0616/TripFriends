# TASK-006 C2: 여행 중 화면 SC-04, 데모 시계로 시각을 옮기며 스크린샷.
# 아직 한 번도 실행하지 않았다 (이 Mac에 Maestro·CocoaPods·Java가 없다). reviewer가 시뮬레이터에서 돌려 확인한다.
# 전제: planning.yaml과 같다. 이 흐름은 S0의 [여행 중 데모 바로 보기]로 시작한다 (계획 흐름을 거치지 않는다).
# 실행: cd apps/mobile && maestro test .maestro/trip-now.yaml
# 시각 막대는 하루 시작~끝(데모 시드 둘째 날 10:00~20:00)을 0~100%로 보고 누른 위치를 5분 단위로 맞춘다.
# 막대 퍼센트는 데모 시드 코스를 가정한 근사값이다. 코스가 다르면 reviewer가 맞춘다. (미정: 이동 중 시각)
# 스크린샷은 .maestro/screenshots/ 에 쌓이고 저장소에는 올리지 않는다 (.gitignore).
appId: com.csh0616.tripfriends
env:
  METRO_URL: http://localhost:8081
---
- launchApp:
    clearState: true
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 중 데모 바로 보기"
    timeout: 60000

# S0의 [여행 중 데모 바로 보기] (개발 빌드에만 있다, TASK-006 §14):
# POST /debug/seed-demo {"chosen": true} -> 둘째 날 SC-04, 그날 17:50부터. 둘째 날에는 고정 일정 "저녁 예약" 18:30~19:30이 있다.
- tapOn:
    id: "s0-now-demo"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 30000
- assertVisible:
    id: "sos-button"
- assertVisible:
    id: "input-bar"
- takeScreenshot: .maestro/screenshots/trip-now-1-1750

# 데모 시계 열기
- tapOn:
    id: "demo-toggle"
- assertVisible:
    id: "demo-panel"

# 고정 일정 직전: +10분 -> 18:00 (저녁 예약 18:30 출발 15분 이하면 T-07). 정확한 카드는 서버 결과를 따른다
- tapOn:
    id: "demo-plus-10"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/trip-now-2-before-fixed

# 하루 시작 10:00: 막대 맨 앞
- tapOn:
    id: "demo-bar"
    point: "1%,50%"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/trip-now-3-1000

# 13:20: 막대 약 33%
- tapOn:
    id: "demo-bar"
    point: "33%,50%"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/trip-now-4-1320

# 이동 중(일정 사이): 막대 약 22% = 12:10 근처. 코스에 따라 reviewer가 맞춘다
- tapOn:
    id: "demo-bar"
    point: "22%,50%"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/trip-now-5-moving

# 일정이 끝난 뒤: 막대 맨 끝 20:00 (T-08)
- tapOn:
    id: "demo-bar"
    point: "99%,50%"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/trip-now-6-after
