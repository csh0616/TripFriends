# TASK-006 C2: 여행 중 화면 SC-04, 데모 시계로 시각을 옮기며 스크린샷.
# 전제: planning.yaml과 같다. 이 흐름은 S0의 [여행 중 데모 바로 보기]로 시작한다 (계획 흐름을 거치지 않는다).
# 개발 서버 주소는 -e로 받는다 (흐름 안의 env: 블록은 -e보다 우선해서 쓰지 않는다).
# 실행 (apps/mobile에서, 시뮬레이터 UDID와 Metro 주소는 자기 것으로):
#   JAVA_HOME="$(brew --prefix openjdk@17)" maestro --udid <UDID> test \
#     --test-output-dir=.maestro/screenshots/trip-now -e METRO_URL=http://127.0.0.1:8083 .maestro/trip-now.yaml
# 스크린샷은 --test-output-dir 아래 takeScreenshot/ 에 쌓이고 저장소에는 올리지 않는다 (.gitignore의 .maestro/screenshots/).
# 시각 막대는 하루 시작~끝(데모 시드 둘째 날 10:00~20:00)을 0~100%로 보고 누른 위치를 5분 단위로 맞춘다.
# TASK-014 §14 ④: 비율로 시각을 고르지 않는다 (기기 폭이 달라지면 99% 같은 좁은 칸이 다른 5분으로 떨어진다).
#   막대는 맨 앞(0% = 하루 시작 10:00, 폭과 상관없음)만 누르고, 시각은 [+10분]을 정한 횟수만큼 눌러 고른다 (10:00 + 10분 × n).
#   한 번이라도 탭이 안 닿으면 시각 글자가 맞지 않아 retry가 0%부터 다시 한다 (두 번 해도 부작용 없음).
# 데모 시드 코스는 고정이라 아래 시각의 카드가 정해져 있다. 코스가 바뀌면 시각을 다시 확인한다.
# 알려진 문제: 앱에 탭이 닿지 않는 현상이 S0 첫 탭, P3 [이걸로 할래], 데모 막대에서 재현됐다.
# 원인 미확인(앱 문제인지 Maestro·XCTest 문제인지 모른다). 우회와 retry로 통과시킨다. 그래서 아래 retry는 결과를 확인하는 묶음으로 적어 두 번 눌러도 부작용이 없다.
appId: com.csh0616.tripfriends
---
- launchApp:
    clearState: true
# TASK-014 §14 ①: 개발 메뉴의 떠 있는 버튼(톱니)이 화면을 덮지 않게 여는 주소에 __expo_disable_fab=1.
# (§13의 launchApp 실행 인자 EXDevMenuShowFloatingActionButton은 효과가 없어 뺐다, reviewer 재점검)
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}&disableOnboarding=1&__expo_disable_fab=1
- tapOn:
    text: "열기"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 중 데모 바로 보기"
    timeout: 60000
# 개발 메뉴가 떠 있으면 직접 닫는다 (TASK-010 §12). 전에는 "AI 여행친구"를 한 번 눌러 첫 탭을 버렸는데,
# 그 탭이 실제로는 앱 위에 떠 있던 개발 메뉴 시트를 닫고 있었다 (첫 탭이 앱에 닿지 않던 원인)
- runFlow: common/close-dev-menu.yaml

# S0의 [여행 중 데모 바로 보기] (개발 빌드에만 있다, TASK-006 §14):
# POST /debug/seed-demo {"chosen": true} -> 둘째 날 SC-04, 그날 17:50부터. 둘째 날에는 고정 일정 "저녁 예약" 18:30~19:30이 있다.
- tapOn:
    id: "s0-now-demo"
- extendedWaitUntil:
    visible:
      id: "now-main"
    timeout: 30000
- assertVisible:
    id: "sos-button"
- assertVisible:
    id: "input-bar"
- takeScreenshot: trip-now-1-1750

# 데모 시계 열기
# 탭이 가끔 앱에 안 닿아서(원인 미확인) 다시 해도 안전한 모양으로 적는다: 패널이 없을 때만 누른다
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "demo-panel"
          commands:
            - tapOn:
                id: "demo-toggle"
      - extendedWaitUntil:
          visible:
            id: "demo-panel"
          timeout: 3000

# 시각을 바꾼 뒤에는 (1) 바뀐 시각 글자(demo-time 옆에 같은 글자가 접근성 글자로 나온다)가 보이는 것을 기다리고 (2) 300ms 디바운스 + 응답을 기다린 뒤 찍는다.
# Maestro에 sleep이 없어서, 없는 글자를 optional로 기다리는 줄을 "잠깐 기다림"으로 쓴다.

# 고정 일정 직전: +10분 -> 18:00 (저녁 예약 18:30의 출발 15분 이하라 T-07)
- tapOn:
    id: "demo-plus-10"
- extendedWaitUntil:
    visible: "18:00"
    timeout: 10000
- extendedWaitUntil:
    visible: "고정 일정 · 곧 출발"
    timeout: 10000
- takeScreenshot: trip-now-2-before-fixed

# 하루 시작 10:00: 막대 맨 앞 (0%)
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "demo-bar"
          point: "0%,50%"
      - extendedWaitUntil:
          visible: "10:00"
          timeout: 3000
- extendedWaitUntil:
    notVisible: "고정 일정 · 곧 출발"
    timeout: 10000
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 1500
    optional: true
- takeScreenshot: trip-now-3-1000

# 13:20: 막대 맨 앞 10:00 + [+10분] 20번
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "demo-bar"
          point: "0%,50%"
      - extendedWaitUntil:
          visible: "10:00"
          timeout: 3000
      - repeat:
          times: 20
          commands:
            - tapOn:
                id: "demo-plus-10"
      - extendedWaitUntil:
          visible: "13:20"
          timeout: 5000
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 1500
    optional: true
- takeScreenshot: trip-now-4-1320

# 이동 중(다음 일정으로 가는 길): 막대 맨 앞 10:00 + [+10분] 24번 = 14:00, 카드 T-02 "지금 나서자"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "demo-bar"
          point: "0%,50%"
      - extendedWaitUntil:
          visible: "10:00"
          timeout: 3000
      - repeat:
          times: 24
          commands:
            - tapOn:
                id: "demo-plus-10"
      - extendedWaitUntil:
          visible: "14:00"
          timeout: 5000
- extendedWaitUntil:
    visible: ".*지금 나서자.*"
    timeout: 10000
- takeScreenshot: trip-now-5-moving

# 일정이 끝난 뒤: 14:00 + [+10분] 38번 = 20:00(36번째에 하루 끝, 남은 2번은 하루 끝에서 멈춤 — TASK-006 B7·TASK-014 §13 11), 카드 T-08
# 하루 끝에서 멈추므로 탭이 몇 번 안 닿아도(36번 이상 닿으면) 결과가 같다
- repeat:
    times: 38
    commands:
      - tapOn:
          id: "demo-plus-10"
- extendedWaitUntil:
    visible: "20:00"
    timeout: 10000
- extendedWaitUntil:
    visible: "숙소로 길 안내"
    timeout: 10000
- takeScreenshot: trip-now-6-after

# 카드 시트 높게: 시트를 위로 끌어도 SOS는 눌리는 자리에 그대로 있다
- swipe:
    start: "50%,60%"
    end: "50%,10%"
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 1000
    optional: true
- assertVisible:
    id: "sos-button"
- takeScreenshot: trip-now-7-sheet-high

# 카드 시트 낮게
- swipe:
    start: "50%,20%"
    end: "50%,95%"
- extendedWaitUntil:
    visible: "없는 글자 (잠깐 기다림)"
    timeout: 1000
    optional: true
- assertVisible:
    id: "sos-button"
- takeScreenshot: trip-now-8-sheet-low
