# TASK-010 §12: 개발 빌드의 개발 메뉴(expo-dev-menu 시트)가 떠 있으면 직접 닫는다. 다섯 흐름이 앱이 뜬 직후 부른다.
# 알아보는 법: 개발 메뉴 머리의 "Connected to:" 글자(expo-dev-menu ios/SwiftUI/HostUrl.swift).
# 닫는 법: 머리 오른쪽 닫기 단추(xmark, iOS 접근성 이름 "Close") -> 그래도 남아 있으면 시트를 아래로 쓸어 내린다.
# 이 파일은 단독으로 돌리는 흐름이 아니다 (runFlow로만 부른다).
appId: com.csh0616.tripfriends
---
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible: "Connected to:"
