# TASK-015 AC-5 · §A 경로 ③ 이름·주소 모두 0건 -> a3 [지도에서 찍기] -> a2 길게 눌러 핀 -> 이름 칸 -> [여기로 정했어] -> 여행 만들기
# 전제·실행 방법은 create-trip.yaml 머리말과 같다 (로컬 Supabase + 점검 서버 8010 가짜 오사카 + 개발 빌드 + Metro). 실행:
#   JAVA_HOME="$(brew --prefix openjdk@17)" maestro --udid <UDID> test \
#     --test-output-dir=.maestro/screenshots/lodging-pin -e METRO_URL=http://127.0.0.1:<Metro 포트> .maestro/lodging-pin.yaml
# 화면 이름(testID)은 apps/mobile/__tests__/task-015-lodging-flow.test.tsx 머리말의 계약과 같다.
# 검색 글 "친구 집 근처": 이름 · 주소 모두 0건 (가짜 공급자). a2 지도는 길게 눌러 핀을 찍는다
appId: com.csh0616.tripfriends
---
- evalScript: |
    ${
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      const tokyo = (offsetDays) => {
        const d = new Date(Date.now() + 9 * 3600 * 1000 + offsetDays * 86400 * 1000);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
      };
      output.start = tokyo(7);
      output.end = tokyo(8);
    }
- launchApp:
    clearState: true
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}&disableOnboarding=1&__expo_disable_fab=1
- tapOn:
    text: "열기"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 만들기"
    timeout: 60000
- runFlow: common/close-dev-menu.yaml
- tapOn: "여행 만들기"
- extendedWaitUntil:
    visible:
      id: "create-trip-submit"
    timeout: 30000
- tapOn:
    id: "field-start-date"
- extendedWaitUntil:
    visible:
      id: "calendar-sheet"
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "cal-day-${output.start}"
    commands:
      - tapOn:
          id: "cal-next"
- tapOn:
    id: "cal-day-${output.start}"
- runFlow:
    when:
      notVisible:
        id: "cal-day-${output.end}"
    commands:
      - tapOn:
          id: "cal-next"
- tapOn:
    id: "cal-day-${output.end}"
- tapOn:
    id: "calendar-confirm"
- tapOn:
    id: "lodging-search"
- inputText: "친구 집 근처"
# 키보드를 먼저 닫는다 (사용자는 [지도에서 찍기]를 누르기 전에 키보드를 닫는다. 아래 a2의 [여기로 정했어]는 일부러 키보드가 열린 채 한 번 누른다)
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "lodging-none"
    timeout: 15000
- assertVisible:
    id: "btn-pick-map"
- takeScreenshot: lodging-pin-1-a3
- tapOn:
    id: "btn-pick-map"
- extendedWaitUntil:
    visible:
      id: "pick-map"
    timeout: 30000
- takeScreenshot: lodging-pin-2-a2-first
# 지도 가운데 위쪽(시트 위)을 길게 눌러 핀
- longPressOn:
    point: "50%,35%"
- extendedWaitUntil:
    visible:
      id: "pick-label"
    timeout: 10000
- tapOn:
    id: "pick-label"
- inputText: "친구 집"
# 키보드가 올라와도 시트(이름 칸 · [여기로 정했어])가 보여야 한다 (§18 막는 것 1)
- assertVisible:
    id: "pick-confirm"
- takeScreenshot: lodging-pin-3-a2-keyboard
# 키보드를 닫지 않고 한 번만 누른다 (TASK-015 §20 #3: 키보드가 열린 채 한 번에 넘어가야 한다)
- tapOn:
    id: "pick-confirm"
- extendedWaitUntil:
    visible:
      id: "lodging-picked"
    timeout: 15000
- assertVisible: "친구 집"
- takeScreenshot: lodging-pin-3-picked
- tapOn:
    id: "create-trip-submit"
- extendedWaitUntil:
    visible: "계획 전"
    timeout: 30000
- takeScreenshot: lodging-pin-4-day-list
# 첫날 계획 -> 코스 (P3). 첫 이동의 출발이 고른 숙소인지는 코스 화면 스크린샷의 집 표시로 본다
- tapOn:
    text: "계획 전"
    index: 0
- extendedWaitUntil:
    visible:
      id: "choice-walk_alley"
    timeout: 30000
- tapOn: "아무거나 찾아 줘"
- extendedWaitUntil:
    visible:
      id: "compose-button"
    timeout: 60000
- tapOn:
    id: "compose-button"
- extendedWaitUntil:
    visible: "코스 짜 봤어"
    timeout: 60000
- takeScreenshot: lodging-pin-5-course-from-lodging
