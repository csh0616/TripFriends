# TASK-010 §D: 빈 첫 화면 -> 날짜(달력 시트, §9 Q17) -> 꼭 갈 곳 1곳 -> [여행 만들기] -> 날짜 목록 -> 첫날 계획 대화 시작. 화면마다 스크린샷 (AC-7).
# 전제: 로컬 Supabase(supabase start)와 그것을 가리키는 점검 서버(가짜 오사카, 결과가 늘 같다)를 켠다. 켜는 법은 supabase/README.md "서버·테스트에 연결".
#   앱은 EXPO_PUBLIC_CHECK_SUPABASE_URL·_KEY로 로컬 Supabase에 익명 로그인한다 (TASK-012 B5, 결정권자 클라우드 프로젝트는 쓰지 않음).
#   launchApp clearState가 기기 세션을 지워 매번 새 익명 사용자로 시작하므로, 서버를 다시 켜지 않아도 여행이 없는 빈 첫 화면이 나온다 (TASK-012: 여행은 DB에 남지만 다른 사용자 것).
# + 개발 빌드가 시뮬레이터에 설치됨 + Metro 실행 중. 개발 서버 주소는 -e로 받는다 (planning.yaml과 같음).
# 실행 (apps/mobile에서, 시뮬레이터 UDID와 Metro 주소는 자기 것으로):
#   JAVA_HOME="$(brew --prefix openjdk@17)" maestro --udid <UDID> test \
#     --test-output-dir=.maestro/screenshots/create-trip -e METRO_URL=http://127.0.0.1:8083 .maestro/create-trip.yaml
# 화면 이름(testID)은 apps/mobile/__tests__/task-010-create-trip.test.tsx 머리말의 계약과 같다.
# 꼭 갈 곳은 가짜 seed(testdata/cities/osaka-seed-fake.yaml)의 "구로몬 시장".
appId: com.csh0616.tripfriends
---
# 날짜: 오늘(도시 시간대 Asia/Tokyo)부터 7일 뒤 하루~이틀 (시작일 규칙 §B1: 오늘~180일 뒤)
- evalScript: |
    ${
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      const tokyo = (offsetDays) => {
        const d = new Date(Date.now() + 9 * 3600 * 1000 + offsetDays * 86400 * 1000);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
      };
      output.start = tokyo(7);
      output.end = tokyo(8);
    }
- launchApp:
    clearState: true
- openLink: exp+mobile://expo-development-client/?url=${METRO_URL}&disableOnboarding=1
- tapOn:
    text: "열기"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "여행 만들기"
    timeout: 60000
# 개발 메뉴가 떠 있으면 직접 닫는다 (TASK-010 §12). 전에는 "AI 여행친구"를 한 번 눌러 첫 탭을 버렸는데,
# 그 탭이 실제로는 앱 위에 떠 있던 개발 메뉴 시트를 닫고 있었다 (첫 탭이 앱에 닿지 않던 원인)
- runFlow: common/close-dev-menu.yaml
- takeScreenshot: create-trip-1-empty-home

- tapOn: "여행 만들기"
- extendedWaitUntil:
    visible:
      id: "create-trip-submit"
    timeout: 30000
- assertVisible: "오사카"
- takeScreenshot: create-trip-2-SC-01-empty

# 날짜: 달력 시트 (§9 Q17, 글자 입력 아님). 시작 -> 끝 두 번 누르고 시트 아래 확정
- tapOn:
    id: "field-start-date"
- extendedWaitUntil:
    visible:
      id: "calendar-sheet"
    timeout: 10000
# 7일 뒤가 다음 달이면 한 달 넘긴다 (시트는 고른 시작일이 없으면 오늘의 달로 열린다, §10 Q28)
- runFlow:
    when:
      notVisible:
        id: "cal-day-${output.start}"
    commands:
      - tapOn:
          id: "cal-next"
- tapOn:
    id: "cal-day-${output.start}"
- runFlow:
    when:
      notVisible:
        id: "cal-day-${output.end}"
    commands:
      - tapOn:
          id: "cal-next"
- tapOn:
    id: "cal-day-${output.end}"
- takeScreenshot: create-trip-3-calendar-sheet
- tapOn:
    id: "calendar-confirm"

- tapOn:
    id: "tab-day-${output.start}"
- tapOn:
    id: "must-search"
- inputText: "구로"
- extendedWaitUntil:
    visible: "구로몬 시장"
    timeout: 15000
- tapOn: "구로몬 시장"
- hideKeyboard
- takeScreenshot: create-trip-4-SC-01-filled

- tapOn:
    id: "create-trip-submit"
- extendedWaitUntil:
    visible: "계획 전"
    timeout: 30000
- takeScreenshot: create-trip-5-day-list

# 첫날 줄 = 처음 보이는 "계획 전" 줄
- tapOn:
    text: "계획 전"
    index: 0
- extendedWaitUntil:
    visible:
      id: "choice-walk_alley"
    timeout: 30000
- takeScreenshot: create-trip-6-first-day-planning

# 피드백 11-09 + TASK-011 C2: 날짜 목록의 [새 여행 만들기]는 확인 시트(sheet-confirm) 한 번. [그대로 둘게]면 그대로, [새로 만들기]면 SC-01
# 시트 이름(testID)은 apps/mobile/__tests__/task-011-new-trip-sheet.test.tsx 머리말의 계약과 같다.
# 첫날 계획 화면에서 뒤로 -> 날짜 목록
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible: "계획 전"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "new-trip"
- tapOn:
    id: "new-trip"
- extendedWaitUntil:
    visible:
      id: "new-trip-sheet"
    timeout: 10000
- assertVisible: "지금 여행은 보관돼. 새로 만들까?"
- assertVisible: "보관한 여행은 지금은 다시 열 수 없어"
- takeScreenshot: create-trip-7-new-trip-confirm-sheet
- tapOn:
    id: "new-trip-keep"
- assertNotVisible:
    id: "new-trip-sheet"
- assertVisible: "계획 전"
- assertNotVisible:
    id: "create-trip-submit"
- tapOn:
    id: "new-trip"
- extendedWaitUntil:
    visible:
      id: "new-trip-sheet"
    timeout: 10000
- tapOn:
    id: "new-trip-confirm"
- extendedWaitUntil:
    visible:
      id: "create-trip-submit"
    timeout: 30000
- takeScreenshot: create-trip-8-new-trip-SC-01
