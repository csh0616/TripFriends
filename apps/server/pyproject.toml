[project]
name = "tripfriends-server"
version = "0.1.0"
description = "Tripfriends 서버: FastAPI + 카드 카탈로그 + 판단기 + 화면 조합"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: 실제 Jev를 부르는 테스트 (기본 실행에서 제외, `-m live`로 실행)"]
addopts = "-m 'not live'"
