[project]
name = "tripfriends-server"
version = "0.1.0"
description = "Tripfriends 서버: FastAPI + 카드 카탈로그 + 판단기 + 화면 조합"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "hypothesis",
    "mutmut>=3.8.1",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: 실제 Jev를 부르는 테스트 (기본 실행에서 제외, `-m live`로 실행)"]
addopts = "-m 'not live'"

[tool.mutmut]
# 돌연변이 대상은 compose_screen만 (TASK-001 §3-4, 목표 80%)
paths_to_mutate = ["engine/compose.py"]
also_copy = ["catalog", "deciders", "api", "engine/__init__.py"]
tests_dir = ["tests/test_compose.py"]
