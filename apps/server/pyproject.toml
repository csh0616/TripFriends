[project]
name = "tripfriends-server"
version = "0.1.0"
description = "Tripfriends 서버: FastAPI + 카드 카탈로그 + 판단기 + 화면 조합"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis",
    "mutmut>=3.8.1",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: 실제 Jev를 부르는 테스트 (기본 실행에서 제외, `-m live`로 실행)"]
# TASK-005 §9-4: 시간 재는 테스트(slow)도 기본 실행에서 뺀다. `uv run pytest -m slow`로 따로 돌린다
addopts = "-m 'not live and not slow'"
# 한글 parametrize id를 \uXXXX로 바꾸지 않는다. 바뀐 id로는 mutmut이 테스트를 다시 고르지 못해
# (pytest 종료 코드 4) 모든 돌연변이를 "잡힘"으로 잘못 센다
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.mutmut]
# 돌연변이 대상: compose_screen (TASK-001 §3-4, 목표 80%) + TASK-007 F5: 여행 중 화면 `trip/now.py`(_decide 등)와 감지 `trip/detect.py` + TASK-008: 영업 확인·닫힘 대안 규칙 `trip/visit.py` + §14~§16: 순서 그대로 시각 다시 계산 `trip/retime.py` + §17: 닫힘 이유 문장 `trip/phrase.py` + TASK-010: 날 상태 `trip/days.py`, Google 영업시간 메모리 `places/live.py`, 영업시간 값 뽑기 `places/serper.py`, 캐시 수명 `places/cache.py`, 만들기 `places/build.py`, 팩·facts `places/pack.py`, 여행 만들기 규칙 `trip/trips.py`
source_paths = ["engine/compose.py", "trip/now.py", "trip/detect.py", "trip/visit.py", "trip/retime.py", "trip/phrase.py", "trip/days.py", "trip/trips.py", "places/serper.py", "places/cache.py", "places/build.py", "places/pack.py", "places/live.py"]
also_copy = ["catalog", "deciders", "api", "engine", "graphs", "planning", "trip/__init__.py", "trip/schemas.py", "trip/repo.py", "trip/alternatives.py", "trip/service.py", "places/__init__.py", "places/provider.py", "places/seed.py", "places/factory.py", "places/city.py", "places/__main__.py", "tests"]
pytest_add_cli_args_test_selection = ["tests/test_compose.py", "tests/test_task006_now.py", "tests/test_task007_detect.py", "tests/test_task007_trip.py", "tests/test_task008_rules.py", "tests/test_task008_visit.py", "tests/test_task009_polish.py", "tests/test_task010_carry.py", "tests/test_task010_places.py", "tests/test_task010_trips.py", "tests/test_task010_live.py", "tests/test_task010_resolve.py", "tests/test_task010_q3.py"]
