# TASK-010 §S 모양을 따른 **테스트용 가짜 seed** (test-writer가 손으로 만듦).
# 정본 docs/data/osaka-seed.yaml(PM 작성)이 아니다. 이름·별칭·지역·카테고리·머무는 시간·혼잡·가격·분위기는 지어낸 값이다.
# 지역 3곳(namba·shinsaibashi·umeda), 카테고리 8종을 모두 포함한다.
# 공급자 응답(가짜)은 testdata/cities/osaka-fake.json 에 있다. 아래 query가 그 파일의 resolve 표 키다.
# 맨 위 city_code·timezone·center는 이 테스트가 정한 모양 (질문: 정본 seed에도 있는지). center = 숙소가 없을 때 시작점(§9 Q10 난바역).
# center도 장소처럼 query로 resolve -> place_id만 팩에, 좌표는 캐시에 (AC-2: 팩에 좌표 없음).
# 일부러 넣은 경우:
#   osaka-fake-not-found  : resolve 0곳 -> 팩에서 빠지고 보고 (§A2)
#   osaka-fake-ambiguous  : resolve 여러 곳 -> 팩에서 빠지고 보고 (§A2)
#   osaka-fake-closed-shop: 영구 폐업 -> 팩에서 빠지고 보고 (§A4)
#   osaka-fake-gallery    : 임시 휴업 -> 팩에 넣고 영업시간 fact unknown (§A4)
#   osaka-fake-alley-cafe : Google 영업시간 없음 + Serper 값 하나(+ 定休日 火曜) -> serper·unverified, closed_days도 unverified (§A3, §9 Q8)
#   osaka-fake-comedy     : Google 영업시간 없음 + Serper 값 엇갈림 -> unknown (§A3)
#   osaka-fake-far-umeda  : area=umeda인데 찾은 곳이 지역 중심에서 약 4km -> ambiguous로 빼고 보고 (PM 답 Q2: 3km 밖)
#   osaka-fake-edge-in    : 지역 중심에서 2.9km -> 팩에 넣음 / osaka-fake-edge-out: 3.1km -> ambiguous
# areas(지역 중심)는 이 테스트가 정한 모양 (질문: 정본 seed에 있는지). center처럼 이름 + query, 좌표는 캐시에만.
